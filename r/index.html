<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>A recipe from Macrowave</title>
<meta property="og:title" content="A recipe from Macrowave">
<meta property="og:description" content="Tap to add it to Macrowave, or read it here.">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Damion&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF8F3; --surface: #FFFFFF; --raised: #F1ECF4;
    --text: #1A1027; --muted: #5F5272; --faint: #716585;
    --accent: #D6197A; --protein: #0A7A73; --carbs: #936212; --fat: #6B4FE0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #140B24; --surface: #1E1233; --raised: #2A1A45;
      --text: #F7F2FB; --muted: #B9A6D9; --faint: #9A88BD;
      --accent: #FF4FA3; --protein: #1FD1C1; --carbs: #FFC65C; --fat: #B592FF;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
  .mark { font-family: Damion, cursive; font-size: 36px; color: var(--accent); line-height: 1; text-decoration: none; }
  h1 { font-size: 30px; line-height: 1.15; margin: 20px 0 4px; overflow-wrap: anywhere; }
  .makes { color: var(--muted); margin: 0; }
  .card { background: var(--surface); border-radius: 16px; padding: 16px; margin-top: 16px; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); margin: 0 0 12px; }
  .macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
  .macros b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .macros span { font-size: 13px; color: var(--muted); }
  .kcal b { color: var(--accent); } .p b { color: var(--protein); } .c b { color: var(--carbs); } .f b { color: var(--fat); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 12px; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--raised); }
  li:first-child { border-top: 0; padding-top: 0; }
  li .name { overflow-wrap: anywhere; }
  li .amount { display: block; font-size: 15px; color: var(--muted); }
  li .cal { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .open { display: block; margin-top: 24px; padding: 16px; border-radius: 14px; text-align: center;
    background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
  .note { color: var(--muted); font-size: 15px; text-align: center; margin: 12px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <a class="mark" href="/">mw</a>

  <section id="recipe" hidden>
    <h1 id="name"></h1>
    <p class="makes" id="makes"></p>

    <div class="card">
      <p class="label">Per serving</p>
      <div class="macros">
        <div class="kcal"><b id="kcal"></b><span>kcal</span></div>
        <div class="p"><b id="protein"></b><span>protein</span></div>
        <div class="c"><b id="carbs"></b><span>carbs</span></div>
        <div class="f"><b id="fat"></b><span>fat</span></div>
      </div>
    </div>

    <div class="card">
      <p class="label">Ingredients</p>
      <ul id="ingredients"></ul>
    </div>

    <a class="open" id="open" href="#">Add to Macrowave</a>
    <p class="note">Macrowave is in beta on iPhone. Ask whoever sent this for an invite.</p>
  </section>

  <section id="broken" hidden>
    <h1>This recipe link is incomplete</h1>
    <p class="makes">Part of it may have been cut off. Ask for it to be sent again.</p>
  </section>
</main>

<script>
  // The recipe is in the fragment: raw DEFLATE of the JSON, in URL-safe base64. Browsers
  // never send the fragment to the server, so the recipe stays between the two phones.
  async function readRecipe(fragment) {
    const base64 = fragment.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - fragment.length % 4) % 4);
    const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    const recipe = JSON.parse(await new Response(stream).text());
    if (typeof recipe.name !== "string" || !Array.isArray(recipe.ingredients)) throw new Error("not a recipe");
    return recipe;
  }

  const num = (value, places = 2) => Number(value.toFixed(places)).toLocaleString();
  const grams = value => Math.round(value).toLocaleString();

  // Matches LogAmount.label(servingDescription:) in the app: "6 oz", "2 × 1 cup".
  function amountLabel(item) {
    const amount = item.amount || { unit: { serving: {} }, quantity: item.servings };
    const unit = amount.unit || {};
    const q = amount.quantity;
    let description, count = q;
    if (unit.portion) { description = unit.portion._0.label; }
    else if (unit.grams) { description = `${grams(q)} g`; count = 1; }
    else if (unit.ounces) { description = `${num(q)} oz`; count = 1; }
    else if (unit.pounds) { description = `${num(q)} lb`; count = 1; }
    else { description = item.servingDescription; }
    return count === 1 ? description : `${num(count)} × ${description}`;
  }

  function show(recipe, fragment) {
    document.title = `${recipe.name} · Macrowave`;
    document.getElementById("name").textContent = recipe.name;
    const made = recipe.servingsMade || 1;
    document.getElementById("makes").textContent =
      `Makes ${made === 1 ? "1 serving" : `${num(made)} servings`} · ${recipe.servingDescription} each`;

    const total = { calories: 0, protein: 0, carbs: 0, fat: 0 };
    const list = document.getElementById("ingredients");
    for (const item of recipe.ingredients) {
      for (const key in total) total[key] += (Number(item[key]) || 0) * (Number(item.servings) || 0);
      const row = document.createElement("li");
      const left = document.createElement("div");
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = item.brand ? `${item.brand} ${item.name}` : item.name;
      const amount = document.createElement("span");
      amount.className = "amount";
      amount.textContent = amountLabel(item);
      left.append(name, amount);
      const cal = document.createElement("span");
      cal.className = "cal";
      cal.textContent = `${Math.round(item.calories * item.servings).toLocaleString()} kcal`;
      row.append(left, cal);
      list.append(row);
    }
    const per = key => total[key] / Math.max(made, 1);
    document.getElementById("kcal").textContent = Math.round(per("calories")).toLocaleString();
    document.getElementById("protein").textContent = `${Math.round(per("protein"))}g`;
    document.getElementById("carbs").textContent = `${Math.round(per("carbs"))}g`;
    document.getElementById("fat").textContent = `${Math.round(per("fat"))}g`;

    // For when the link opened here instead of the app: Macrowave's own scheme opens it there.
    document.getElementById("open").href = `macrowave://recipe#${fragment}`;
    document.getElementById("recipe").hidden = false;
  }

  // A different link pasted into the same tab only changes the fragment, which doesn't reload.
  addEventListener("hashchange", () => location.reload());

  const fragment = location.hash.slice(1);
  readRecipe(fragment)
    .then(recipe => show(recipe, fragment))
    .catch(() => { document.getElementById("broken").hidden = false; });
</script>
</body>
</html>
