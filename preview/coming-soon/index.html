/* Effects share the illustration's coordinate system. */
.oven-light,.steam{opacity:0}
.cooking .oven-light{animation:oven-light 2.8s ease-in-out infinite}
.cooking .steam{animation:steam-rise 2.8s linear infinite}
.cooking .steam-middle{animation-duration:3.2s;animation-delay:-1.1s}
.cooking .steam-right{animation-duration:2.6s;animation-delay:-1.9s}

.timer-back{fill:#02ccc4}
.timer-digits{fill:#1c0b2d;font-size:49px;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-weight:900;letter-spacing:-3px}
.suspended .oven-light,.suspended .steam{animation-play-state:paused}

.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:12px auto 0}.btn{border:3px solid var(--ink);border-radius:14px;padding:12px 18px;background:var(--yellow);box-shadow:3px 4px 0 var(--ink);font:900 13px system-ui,-apple-system,sans-serif;letter-spacing:.04em;color:var(--ink);cursor:pointer;touch-action:manipulation}.btn.secondary{background:#fff}.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}.tagline{margin:4px auto 0;font-size:clamp(14px,2.4vw,20px);font-weight:800}.status{min-height:1.5em;margin:16px 0 0;font-size:13px;font-weight:700;color:#7b6e83}.footer{margin-top:10px;font-size:11px;letter-spacing:.14em;color:#776a79;font-weight:800}.contact{margin:8px 0 0;font-size:12px;font-weight:700;color:#776a79}.contact a{color:inherit}

@keyframes oven-light{
  0%,100%{opacity:.22}
  50%{opacity:.88}
}
@keyframes steam-rise{
  0%{opacity:0;transform:translate(0,18px)}
  22%{opacity:.73}
  58%{opacity:.53;transform:translate(7px,-39px)}
  100%{opacity:0;transform:translate(-5px,-102px)}
}
@media(prefers-reduced-motion:reduce){
  .cooking .oven-light{animation:none;opacity:.44}
  .cooking .steam{animation:none}
}
</style></head><body><main class="page" id="page"><p class="eyebrow">The next big thing is heating up</p><h1 class="heading">Something's <span>Cooking!</span></h1><div class="stage" role="img" aria-label="The original approved Macrowave illustration featuring the mw logo on a bowl in a teal and cream cartoon microwave"><img class="art" alt="" draggable="false" src="/img/coming-soon.webp" width="1672" height="941"><svg class="fx" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><defs>

<g clip-path="url(#oven-window)">
  <g class="oven-light">
    <rect x="457" y="380" width="521" height="299" fill="url(#oven-ambient)"/>
    <ellipse cx="867" cy="410" rx="111" ry="67" fill="url(#lamp-halo)"/>
  </g>
  <g clip-path="url(#above-bowl)" mask="url(#steam-depth)" fill="none" stroke="#fff6d8" stroke-linecap="round">
    <path class="steam" stroke-width="11" d="M673 511C699 490 693 474 679 462C664 449 666 435 676 425"/>
    <path class="steam steam-middle" stroke-width="13" d="M729 513C753 490 753 472 734 458C716 444 719 429 731 415"/>

<rect class="timer-back" x="1021" y="382" width="146" height="69" rx="12"/><text id="timer" class="timer-digits" x="1094" y="434" text-anchor="middle">99:59</text></svg></div><p class="tagline">Your macros. Your meals. A whole lot of mwagic.</p><div class="controls"><button id="reheat" class="btn" type="button">↻ REHEAT</button><button id="pause" class="btn secondary" type="button">Ⅱ PAUSE ANIMATION</button></div><div id="status" class="status" aria-live="polite">Warming up…</div><div class="footer">MACROWAVE · COMING SOON</div><p class="contact">Questions? <a href="mailto:burland313@gmail.com">burland313@gmail.com</a> · <a href="/privacy/">Privacy Policy</a></p></main><script>
(() => {
  'use strict';

  const displayRange = 100 * 60;
  const page = document.getElementById('page');
  const timer = document.getElementById('timer');
  const status = document.getElementById('status');
  const pause = document.getElementById('pause');

  let frame = 0;
  let elapsed = 0;
  let startedAt = null;
  let paused = false;

  function render(time) {
    // Only the display rolls over. The steam and light keep their own phase.
    const remaining = displayRange - 1 - (Math.floor(time / 1000) % displayRange);
    const minutes = String(Math.floor(remaining / 60)).padStart(2, '0');
    const seconds = String(remaining % 60).padStart(2, '0');
    const digits = minutes + ':' + seconds;
    if (timer.textContent !== digits) timer.textContent = digits;
  }

  function tick(now) {
    render(elapsed + Math.max(0, now - startedAt));
    frame = requestAnimationFrame(tick);
  }

  function syncPlayback() {
    const suspended = paused || document.hidden;
    page.classList.toggle('suspended', suspended);

    if (suspended && startedAt !== null) {
      cancelAnimationFrame(frame);
      elapsed += performance.now() - startedAt;
      startedAt = null;
      render(elapsed);
    } else if (!suspended && startedAt === null) {
      startedAt = performance.now();
      frame = requestAnimationFrame(tick);
    }

    const label = paused ? '▶ RESUME ANIMATION' : 'Ⅱ PAUSE ANIMATION';
    const message = paused ? 'Paused' : 'Warming up…';
    if (pause.textContent !== label) pause.textContent = label;
    if (status.textContent !== message) status.textContent = message;
  }

  document.getElementById('reheat').addEventListener('click', () => {
    cancelAnimationFrame(frame);
    elapsed = 0;
    startedAt = null;
    paused = false;
    render(0);
    syncPlayback();
  });
  pause.addEventListener('click', () => {
    paused = !paused;
    syncPlayback();
  });
  document.addEventListener('visibilitychange', syncPlayback);
  page.classList.add('cooking');
  syncPlayback();
})();
</script></body></html>
